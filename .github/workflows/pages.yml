name: Pages

# Build the docs site (compiling the live WASM demos + syntax-highlighted source
# pages) and deploy it to GitHub Pages.
# Enable once under Settings ▸ Pages ▸ Source: "GitHub Actions".

# Every push to main, with no path filter. The demos are Go programs that
# statically link the framework, so a change anywhere in the module changes what
# the site serves — widget, app, shell, paint, chart and the vendored substrate
# all end up inside those .wasm files.
#
# The filter that used to be here listed docs/** and examples/**, which reads
# sensibly and is wrong for exactly that reason: three scroll fixes in widget/,
# app/ and shell/ shipped to main and the site went on serving demos built from
# the code before them. Nothing failed — the site was simply, silently, a
# release behind, which is the worst way for this to be wrong. A deploy takes
# about 75 seconds and correctness is worth more than that.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build WASM demos
        run: ./docs/build-demos.sh
      - name: Highlight source pages
        run: ./docs/build-source.sh
      - name: Refresh embedded code listings
        run: ./docs/build-embeds.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
