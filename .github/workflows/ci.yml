name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test scoping (see design/substrate-consolidation.md):
#   - lint:           fast gates — gofmt, go vet (framework scope), generated-code
#                     freshness, and a tracked-binary size guard.
#   - build:          the "one static binary, zero CGo" invariant, cross-compiled.
#   - test-framework: gophics's own packages (CPU/headless, deterministic) — the
#                     gate — plus the examples, which are the integration suite.
#   - test-substrate: the vendored internal/gfx + internal/audio. Blocking, in
#                     two passes: -tags nogpu (pure CPU, deterministic
#                     anywhere) and the default build. This job also runs the
#                     framework's own gophics_gpu-tagged tests, which no other
#                     job does.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt, go vet (framework scope), generated-code freshness, doc-embed
      # drift and the tracked-binary size guard. The same script runs from
      # .githooks/pre-push, so a developer sees these before the push rather
      # than in a red run afterwards — this job used to be a second copy of
      # that shell, and copies drift.
      - name: gates
        run: ./scripts/gates.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64 }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64 }
          - { runner: ubuntu-latest, goos: js,      goarch: wasm  }
          - { runner: macos-latest,  goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
      - name: go build -tags nogpu (pure-CPU, no wgpu)
        if: matrix.goos == 'linux'
        env:
          CGO_ENABLED: "0"
        run: go build -tags nogpu ./...
      - name: no cgo in the tree
        if: matrix.goos == 'linux'
        run: |
          if grep -rl 'import "C"' --include='*.go' . ; then
            echo "cgo found — the zero-CGo invariant is broken"; exit 1
          fi

  test-framework:
    name: test (framework)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner ships no CJK font, so the system-fallback test can only
      # reach .notdef. Installing one makes that test meaningful here rather
      # than skipped, and GOPHICS_REQUIRE_SYSTEM_CJK turns a missing glyph back
      # into a failure now that the font is guaranteed present.
      - name: install CJK fonts for the system-fallback test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - name: framework tests (CPU/headless)
        env:
          GOPHICS_REQUIRE_SYSTEM_CJK: "1"
        run: go test -race -count=1 $(go list ./... | grep -vE 'internal/gfx|internal/audio|/examples/')

      # The nogpu build was compiled but never exercised. It is the pure-CPU
      # fallback, and it is not hypothetical: a machine with no graphics driver
      # — a VM, an RDP session, a fresh Windows install — lands on it, which is
      # exactly what happened when a gophics app was first run under UTM.
      # Compiling it proves the tags line up; running it proves the path works.
      - name: framework tests (pure-CPU, -tags nogpu)
        run: go test -tags nogpu -count=1 $(go list ./... | grep -vE 'internal/gfx|internal/audio|/examples/')

      # The examples are excluded above because they are demos, but their tests
      # are not demo-grade: they drive real widget trees headlessly and are the
      # closest thing here to an integration suite. They caught a feed
      # regression that every unit test missed.
      #
      # Run without -race, which is what keeps this to about two minutes rather
      # than ten. Anything genuinely machine-dependent skips itself.
      - name: example tests (headless integration)
        run: go test -count=1 -timeout 20m ./examples/...

  test-substrate:
    name: test (substrate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Compiling the substrate's tests is its own gate. An interface change in
      # internal/gfx can break a test file while every build stays green: `go
      # build` does not compile tests, and the lint job's vet deliberately skips
      # this tree.
      - name: substrate tests compile
        run: go test -run '^$' -count=1 ./internal/...

      # The pure-CPU pass. No adapter, no toolchain, no display: whatever fails
      # here fails on any machine, so it blocks unconditionally and runs on the
      # cheapest thing available.
      #
      # This is the pass that would have caught TestStrokeClipped, which sat red
      # on main while every job stayed green.
      - name: substrate tests (pure-CPU, -tags nogpu)
        run: go test -tags nogpu -count=1 -timeout 15m ./internal/...

      # The default build, which is where the GPU-tagged code lives.
      #
      # This ran before and could not fail: it was marked continue-on-error on
      # the grounds that GPU and toolchain cases depend on the machine. Of the
      # 75 tagged test files under internal/gfx, three so much as name an
      # adapter, and two of those skip themselves when there is none — the rest
      # is ordinary deterministic code sitting behind a build tag. So the flag
      # was suppressing 70-odd files' worth of real signal to accommodate two
      # that already handle their own absence.
      #
      # It cost exactly what you would expect. A self-deadlock in the
      # compute-mode draw paths hung this step for ten minutes, the step went
      # red, and continue-on-error swallowed it; the bug reached main and stayed
      # there. The explicit timeout is here for the same reason: a hang should
      # end the job promptly rather than burn the wall clock and then be
      # ignored.
      #
      # If a genuinely machine-dependent case turns up, skip that test on its
      # own prerequisite rather than restoring the blanket flag.
      - name: substrate tests
        run: go test -count=1 -timeout 20m ./internal/...

      # The framework's GPU correctness tests live behind the gophics_gpu tag,
      # so nothing was running them: GPU-vs-CPU equivalence, gradient
      # interpolation, flat and nested opacity groups, shadows, backdrop blur
      # and readback. They pass on Metal and are cheap; a regression in any of
      # them would otherwise surface as a visual bug on someone's screen.
      #
      # Safe to block on: each self-skips when no headless adapter is available,
      # so the worst case on a runner without one is the silence we had before.
      # The verbose output makes it visible which of the two happened.
      # Verbose so the log shows which tests ran and which skipped — the
      # difference between a GPU actually being exercised and this quietly
      # doing nothing.
      - name: framework GPU tests (self-skip without an adapter)
        run: go test -tags gophics_gpu -count=1 -v ./app/ ./paint/

  # The GPU compute pipeline has only ever run on Metal. Everything that made
  # it work — a select-parens fix and a runtime-array bound in naga's MSL
  # backend, Metal's storage-buffer limit, and the _mslBufferSizes wiring — is
  # MSL-specific, and the SPIR-V path shares none of it. This project targets
  # Vulkan, Metal and CPU, so "works on Metal" is a third of the claim.
  #
  # lavapipe is Mesa's software Vulkan implementation: slow, but a real Vulkan
  # driver exercising the real SPIR-V path.
  test-vulkan:
    name: test (compute on Vulkan/lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install a software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary || true

      # GOPHICS_REQUIRE_GPU turns "no adapter" from a skip into a failure.
      # Without it this job would install a driver, find nothing, skip every
      # test and report success — which is exactly how the compute pipeline
      # stayed broken on Metal for months while its tests quietly skipped.
      - name: compute pipeline on Vulkan
        env:
          GOPHICS_REQUIRE_GPU: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          go test -count=1 -v -timeout 20m \
            -run 'TestVelloComputeInitialisesOnRealDevice|TestVelloComputeGolden|TestComputeStagesMatchCPU|TestComputePresentsToGPUDirectTarget|TestOffscreenHarnessDrivesBothPipelines' \
            ./internal/gfx/gg/internal/gpu/
