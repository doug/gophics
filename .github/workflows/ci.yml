name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test scoping (see design/substrate-consolidation.md):
#   - lint:           fast gates — gofmt, go vet (framework scope), generated-code
#                     freshness, and a tracked-binary size guard.
#   - build:          the "one static binary, zero CGo" invariant, cross-compiled.
#   - test-framework: gophics's own packages (CPU/headless, deterministic) — the gate.
#   - test-substrate: the vendored internal/gfx + internal/audio. Their
#                     GPU / Metal-toolchain / interactive-display tests self-skip
#                     when those prerequisites are absent, so this job is
#                     best-effort (does not block merges).

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      # Vet only the framework packages — the vendored internal/gfx +
      # internal/audio have known benign unsafe.Pointer vet warnings.
      - name: go vet (framework scope)
        run: go vet $(go list ./... | grep -vE 'internal/gfx|internal/audio|/examples/')
      # A stale capabilities_gen.go (widget/, app/, and any shell/ *_gen.go)
      # must not pass silently: regenerate and require a clean tree.
      - name: generated code is fresh
        run: |
          go generate ./widget
          git diff --exit-code
      # Repo hygiene: no tracked binaries >1MB outside testdata/asset dirs
      # (and known large-but-legit asset extensions).
      - name: no oversized tracked files
        run: |
          bad=$(git ls-files | while read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 1048576 ]; then
              case "$f" in
                */testdata/*|*/assets/*|*.png|*.jpg|*.wasm.br) ;;
                *) echo "oversized tracked file: $f ($size bytes)" ;;
              esac
            fi
          done)
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64 }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64 }
          - { runner: ubuntu-latest, goos: js,      goarch: wasm  }
          - { runner: macos-latest,  goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
      - name: go build -tags nogpu (pure-CPU, no wgpu)
        if: matrix.goos == 'linux'
        env:
          CGO_ENABLED: "0"
        run: go build -tags nogpu ./...
      - name: no cgo in the tree
        if: matrix.goos == 'linux'
        run: |
          if grep -rl 'import "C"' --include='*.go' . ; then
            echo "cgo found — the zero-CGo invariant is broken"; exit 1
          fi

  test-framework:
    name: test (framework)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: framework tests (CPU/headless)
        run: go test -race -count=1 $(go list ./... | grep -vE 'internal/gfx|internal/audio|/examples/')

  test-substrate:
    name: test (substrate, best-effort)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: substrate tests (GPU/toolchain tests self-skip)
        run: go test -count=1 ./internal/...
