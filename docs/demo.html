<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gophics — live demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e15; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  /* Loader: a lightweight, on-brand loading animation shown while the ~MB wasm
     downloads and compiles, then cross-faded out once the live canvas appears.
     It's pure CSS (no image to fetch), so it paints instantly. Three additive-
     blended discs — an RGB colour-mixing motif, apt for a graphics framework —
     orbit a shared centre while each gently breathes. */
  #loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 22px; background: #0d0e15;
            transition: opacity .5s ease; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .orbit { position: relative; width: 62px; height: 62px; animation: spin 1.5s linear infinite; }
  .orbit i { position: absolute; width: 34px; height: 34px; border-radius: 50%;
             mix-blend-mode: screen; animation: breathe 1.5s ease-in-out infinite; }
  .orbit i:nth-child(1) { background: #ff4d6d; top: 0; left: 14px; }
  .orbit i:nth-child(2) { background: #3d8bff; bottom: 0; left: 0; animation-delay: -.5s; }
  .orbit i:nth-child(3) { background: #46e08a; bottom: 0; right: 0; animation-delay: -1s; }
  .loading { font-size: 13px; letter-spacing: .08em; color: #6b7391; }
  .loading b { color: #8aa0ff; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  #err { position: fixed; inset: 0; z-index: 12; display: none; align-items: center; justify-content: center;
         color: #c9cee0; font-size: 14px; text-align: center; padding: 24px; line-height: 1.6; }
  #err a { color: #8aa0ff; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20;
         display: flex; align-items: center; gap: 14px; padding: 0 14px;
         font-size: 13px; color: #aab; background: linear-gradient(#000c, #0000);
         opacity: .7; transition: opacity .15s; pointer-events: none; }
  #bar:hover { opacity: 1; }
  #bar a, #bar .name { pointer-events: auto; }
  #bar a { color: #cdd3e6; text-decoration: none; }
  #bar a:hover { color: #fff; }
  #bar .name { color: #8aa0ff; font-weight: 600; }
  #bar .sp { flex: 1; }
</style>
</head>
<body>
  <div id="bar">
    <a href="gallery.html">← gallery</a>
    <span class="name" id="nm">demo</span>
    <span class="sp"></span>
    <a id="src" href="gallery.html">view source</a>
  </div>
  <div id="loader">
    <div class="orbit"><i></i><i></i><i></i></div>
    <div class="loading">loading <b id="lname">demo</b></div>
  </div>
  <div id="err"></div>
  <script src="demos/wasm_exec.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const demo = (params.get("sketch") || params.get("demo") || "hn").replace(/[^a-z0-9]/gi, "");
    document.getElementById("src").href = "source/" + demo + ".html";
    document.title = "gophics — " + demo;
    const nm = document.getElementById("nm");
    const loader = document.getElementById("loader");
    const err = document.getElementById("err");
    document.getElementById("lname").textContent = demo;

    // ?cpu forces the CPU rasterizer by hiding WebGPU before the wasm reads it.
    // WebGPU is only exposed in a secure context (https or localhost) and on a
    // supported GPU, so it's undefined over plain http even on capable devices;
    // the Go runtime then falls back to a 2D-canvas CPU path automatically.
    // ?bare=1 hides the chrome so this page can be embedded (the home hero
    // stacks it under a screenshot). It is hidden rather than removed: the
    // wiring below reaches into #bar's children, and detaching them made every
    // later lookup null, which threw and took the wasm load down with it.
    const bar = document.getElementById("bar");
    const bare = params.has("bare");
    if (bare) {
      bar.style.display = "none";
      // No loader either. An embedding page shows its own placeholder until
      // this frame is ready, so a spinner here would only ever be glimpsed
      // through the cross-fade — which is exactly the flash it is meant to
      // prevent everywhere else.
      loader.style.display = "none";
    }

    const forceCPU = params.has("cpu");
    if (forceCPU && "gpu" in navigator) {
      Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true });
    }
    // WebGPU is the default wherever the browser offers it, and there is no
    // visible switch: a visitor choosing the slower rasterizer from a toolbar
    // is judging gophics by a path it does not ship on. The renderer is named
    // only when ?cpu forced it, so whoever set the flag can see it took.
    nm.textContent = forceCPU ? demo + " \u00b7 CPU" : demo;

    // The toggle used to double as the recovery path for a flaky mobile WebGPU
    // driver, which loads the wasm fine and then presents nothing — a failure
    // the .catch below never sees, because nothing threw. So recovery is
    // offered where that actually shows up: if no frame arrives, say so and
    // link to ?cpu. On a working demo reveal() cancels this before it fires.
    let stall = null;
    if (!forceCPU && navigator.gpu) {
      stall = setTimeout(() => {
        if (revealed) return;
        loader.remove();
        err.style.display = "flex";
        const u = new URL(location.href);
        u.searchParams.set("cpu", "1");
        err.innerHTML = "<div><code>" + demo + "</code> hasn\'t drawn a frame — " +
          "this browser\'s WebGPU driver may not be working.<br>" +
          "<a href=\"" + u.toString() + "\">Load it with the CPU renderer</a></div>";
      }, 12000);
    }

    // The Go web shell creates its own <canvas>; when it appears, wait two
    // frames (so the first live frame is on screen) then cross-fade the loader
    // away — the animation dissolves into the running app.
    let revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      if (stall) { clearTimeout(stall); stall = null; }
      // Tell an embedding page straight away, before the local fade. This used
      // to sit inside the double requestAnimationFrame below, which was a bug:
      // the home hero loads this frame at opacity 0, and a browser is free to
      // throttle rAF for content it considers invisible — so the message might
      // never be sent and the hero would sit on its screenshot forever.
      if (window.parent !== window) {
        window.parent.postMessage({ gophics: "ready", demo }, "*");
      }
      requestAnimationFrame(() => requestAnimationFrame(() => {
        loader.classList.add("hide");
        setTimeout(() => loader.remove(), 550);
      }));
    }
    // Wait for a frame to actually be on the canvas. gophics fires this from
    // its present path (shell/web/present.go); the flag covers the case where
    // the frame landed before this listener attached.
    if (window.gophics && window.gophics.ready) reveal();
    else addEventListener("gophics:ready", reveal, { once: true });

    // Fallback for demos built before that signal existed: a canvas appearing
    // is early — it is created before anything is drawn — but it is better
    // than hanging on the loader forever.
    const obs = new MutationObserver(() => {
      if (!document.querySelector("canvas")) return;
      obs.disconnect();
      if (!(window.gophics && window.gophics.ready)) setTimeout(reveal, 400);
    });
    obs.observe(document.body, { childList: true, subtree: true });

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("demos/" + demo + ".wasm"), go.importObject)
      .then((res) => go.run(res.instance))
      .catch((e) => {
        if (stall) { clearTimeout(stall); stall = null; }
        loader.remove();
        err.style.display = "flex";
        err.innerHTML = "Couldn't load <code>" + demo + "</code>: " + e;
      });
  </script>
</body>
</html>
