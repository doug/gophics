<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gophics — live demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e15; overflow: hidden; font-family: system-ui, sans-serif; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #c9cee0; font-size: 14px; text-align: center; padding: 24px; line-height: 1.6; }
  #msg a { color: #8aa0ff; }
  canvas { display: block; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20;
         display: flex; align-items: center; gap: 14px; padding: 0 14px;
         font-size: 13px; color: #aab; background: linear-gradient(#000c, #0000);
         opacity: .7; transition: opacity .15s; pointer-events: none; }
  #bar:hover { opacity: 1; }
  #bar a, #bar .name { pointer-events: auto; }
  #bar a { color: #cdd3e6; text-decoration: none; }
  #bar a:hover { color: #fff; }
  #bar .name { color: #8aa0ff; font-weight: 600; }
  #bar .sp { flex: 1; }
  #bar #rend { border: 1px solid #333a52; border-radius: 6px; padding: 2px 8px; }
</style>
</head>
<body>
  <div id="bar">
    <a href="gallery.html">← gallery</a>
    <span class="name" id="nm">demo</span>
    <span class="sp"></span>
    <a id="rend" href="#" title="Toggle renderer">GPU</a>
    <a id="src" href="gallery.html">view source</a>
  </div>
  <div id="msg">Loading demo…</div>
  <script src="demos/wasm_exec.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const demo = (params.get("sketch") || params.get("demo") || "hn").replace(/[^a-z0-9]/gi, "");
    document.getElementById("src").href = "source/" + demo + ".html";
    document.title = "gophics — " + demo;
    const msg = document.getElementById("msg");
    const nm = document.getElementById("nm");

    // ?cpu forces the CPU rasterizer by hiding WebGPU before the wasm reads it.
    // WebGPU is only exposed in a secure context (https or localhost) and on a
    // supported GPU, so it's undefined over plain http even on capable devices;
    // the Go runtime then falls back to a 2D-canvas CPU path automatically.
    const forceCPU = params.has("cpu");
    if (forceCPU && "gpu" in navigator) {
      Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true });
    }
    const onCPU = !navigator.gpu;
    nm.textContent = onCPU ? demo + " · CPU" : demo;

    // Renderer toggle — always available, so a blank GPU canvas (a flaky mobile
    // WebGPU driver) is one tap from the working CPU path, and vice versa.
    const rend = document.getElementById("rend");
    rend.textContent = onCPU ? "GPU" : "CPU";
    rend.title = onCPU ? "Try the WebGPU renderer" : "Switch to the CPU renderer (use if the demo is blank)";
    rend.onclick = (e) => {
      e.preventDefault();
      const u = new URL(location.href);
      if (forceCPU) u.searchParams.delete("cpu"); else u.searchParams.set("cpu", "1");
      location.replace(u.toString());
    };

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("demos/" + demo + ".wasm"), go.importObject)
      .then((res) => { msg.remove(); return go.run(res.instance); })
      .catch((err) => { msg.innerHTML = "Couldn't load <code>" + demo + "</code>: " + err; });
  </script>
</body>
</html>
