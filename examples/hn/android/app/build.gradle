plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.gossamer.hn'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.gossamer.hn'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Built by: gomobile bind -target=android -androidapi 24 \
    //   -o app/libs/hnmobile.aar github.com/doug/gossamer/examples/hn/mobile
    implementation files('libs/hnmobile.aar')
}
