# Generated into Tally.xcodeproj by `xcodegen generate` (see ../package/ios.sh).
# The project file itself is not committed: it is derived, and a generated
# pbxproj is a merge-conflict machine.
name: Tally
options:
  bundleIdPrefix: com.gophics
  deploymentTarget:
    iOS: "15.0"
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - Tally
    dependencies:
      - framework: Tallymobile.xcframework
        embed: true
    info:
      path: Tally/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A ledger reads better wide, and iPad is a natural home for one.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Opening a .beancount file from Files hands Tally the user's own ledger.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Beancount Ledger
            LSHandlerRank: Alternate
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gophics.tally
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
